name: QA Automation CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  web-tests:
    name: Web Automation Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa-automation/package-lock.json
      
      - name: Install dependencies
        working-directory: ./qa-automation
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./qa-automation
        run: npx playwright install --with-deps
      
      - name: Run web tests
        working-directory: ./qa-automation
        run: npm run test:web
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: web-test-results
          path: qa-automation/test-results/
      
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: web-test-screenshots
          path: qa-automation/screenshots/
      
      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: web-test-videos
          path: qa-automation/videos/
      
      - name: Generate Allure report
        if: always()
        working-directory: ./qa-automation
        run: npm run report:generate
      
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: qa-automation/allure-report/

  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa-automation/package-lock.json
      
      - name: Install dependencies
        working-directory: ./qa-automation
        run: npm ci
      
      - name: Run API tests
        working-directory: ./qa-automation
        run: npm run test:api
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-coverage
          path: qa-automation/coverage/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup k6
        uses: grafana/k6-action@v0.3.1
        with:
          k6-version: '0.47.0'
      
      - name: Run performance tests
        working-directory: ./qa-automation
        run: k6 run tests/performance/load-test.js
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
      
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: qa-automation/performance-summary.json

  visual-regression-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa-automation/package-lock.json
      
      - name: Install dependencies
        working-directory: ./qa-automation
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./qa-automation
        run: npx playwright install --with-deps
      
      - name: Run visual regression tests
        working-directory: ./qa-automation
        run: npm run test:visual
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
      
      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: visual-diff
          path: qa-automation/test-results/

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa-automation/package-lock.json
      
      - name: Install dependencies
        working-directory: ./qa-automation
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./qa-automation
        run: npx playwright install --with-deps
      
      - name: Run accessibility tests
        working-directory: ./qa-automation
        run: npm run test:accessibility
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [web-tests, api-tests, performance-tests, visual-regression-tests, accessibility-tests]
    if: always()
    
    steps:
      - name: Send notification
        run: |
          echo "QA Automation Tests completed"
          echo "Web Tests: ${{ needs.web-tests.result }}"
          echo "API Tests: ${{ needs.api-tests.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
          echo "Visual Regression Tests: ${{ needs.visual-regression-tests.result }}"
          echo "Accessibility Tests: ${{ needs.accessibility-tests.result }}"
